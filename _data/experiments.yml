# Experiments listed on /experiments/ — small standalone sites under /sites/
# (copied through by Jekyll as-is) plus other one-off interactive builds.
# Newest first. Each entry is rendered with _includes/project-card.html, so the
# keys mirror project front matter: url, title, description, thumbnail
# (relative to /images), time_period. Thumbnails are 4:3 and go through
# tools/optimize-images.sh like everything else.

- title: Weekly Countdown
  description: A countdown to a recurring weekly moment, e.g. a token reset. Thursday 3:00 AM by default, or any day and time you set. A skeuomorphic instrument dial leads with percent elapsed and remaining.
  url: /sites/countdown/
  thumbnail: /experiments/countdown.jpg
  time_period: September 2026

- title: Slipstream
  description: A wind tunnel for everyday things. Put a cyclist, an umbrella, a van, a tower, or a house in the wind, two ways each, and see which one the air pushes harder. The airflow is solved live on your GPU.
  url: /sites/slipstream/
  thumbnail: /experiments/slipstream.jpg
  time_period: September 2026

- title: Breathe
  description: A guided breathing pacer for coherence, box, and Wim Hof breathing. Set a total time and it rounds up to whole breaths, then paces them with an orb that swells and settles.
  url: /sites/breathe/
  thumbnail: /experiments/breathe.jpg
  time_period: September 2026

- title: Steep
  description: A tea and coffee timer with brew presets, a ring that warms as it fills, and a full-screen flash when time is up. Sized to sit in the corner of a screen while you work.
  url: /sites/steep/
  thumbnail: /experiments/steep.jpg
  time_period: September 2026

- title: Band Cloud
  description: Every band I've seen live, as a word cloud. Click any name for when, where, and who else was on the bill that night.
  url: /sites/band-cloud/
  thumbnail: /experiments/band-cloud.jpg
  time_period: August 2026

- title: Coyote Bail Squad
  description: A play on our "Coyote Bomb Squad" riding group. A random excuse generator for skipping tomorrow's group ride. Submit your own.
  url: /sites/coyotebailsquad/
  thumbnail: /experiments/coyotebailsquad.jpg
  time_period: 2015
