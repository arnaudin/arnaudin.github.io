<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta property="og:site_name" content="Coyote Bail Squad"/>
    <meta property="og:title" content="All time favorite excuses from the Coyote Bail Squad."/>
    <meta property="og:image" content="https://ryanarnaudin.com/sites/coyotebailsquad/images/coyote_sunrise.jpg">
    <title>Coyote Bail Squad</title>

    <!-- Site CSS -->
    <link href="css/styles.css" rel="stylesheet" type="text/css">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Roboto" rel="stylesheet" type="text/css">

    <!-- Bootswatch Superhero CSS -->
    <link href="css/bootstrap.css" rel="stylesheet">
    <link href="css/custom.min.css" rel="stylesheet">
  </head>
  <body>
    <div id="wrap">
      <div class="container">
        <div class="content">
          <div class="jumbotron">
            <p>I'd love to ride with you guys tomorrow, but</p>
            <h1 id="message">...thinking of a good excuse...</h1>
            <br>
            <div>
              <button type="button" class="btn btn-primary" id="button">Another!</button>
              <a class="btn btn-link bail-link" href="https://docs.google.com/forms/d/1OD2ZQwFeM7_0PJ7ZD37nvwXptgR2kgLNN6AmS2QaDIA/viewform?usp=send_form">What's your excuse?</a>
            </div>
          </div>
        </div>
      </div>
      <div class="push"></div>
    </div>
    <footer class="pushfoot">
      <div class="row">
        <div class="col-lg-12">
          <p>Made by <a href="https://ryanarnaudin.com" rel="nofollow">Ryan Arnaudin</a>. Fork on <a href="https://github.com/arnaudin/coyotebailsquad/">Github</a>.</p>
          <p>Based on <a href="https://getbootstrap.com" rel="nofollow">Bootstrap</a> &amp; <a href="https://bootswatch.com/superhero/" rel="nofollow">Superhero</a>.</p>
          <p>Photo: <a href="https://instagram.com/s_youngblade" rel="nofollow">@s_youngblade</a>. Fonts by <a href="https://fonts.google.com" rel="nofollow">Google</a>.</p>
        </div>
      </div>
    </footer>

    <!-- Placed at the end of the document so the pages load faster -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.4/jquery.min.js" integrity="sha256-ImQvICV38LovIsvla2zykaCTdEh1Z801Y+DSop91wMU=" crossorigin="anonymous"></script>
    <script src="js/bootstrap.js"></script>
    <script src="js/excuses.js"></script>
  </body>
